name: Build & Release Overdesk Nexus

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Dependencies
        run: npm install

      - name: Build Web Application (React/Vite)
        run: npm run build

      - name: Build Executable (Electron Builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install electron-builder --win --publish never

      - name: Upload Installer Artifact to GitHub Action Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Overdesk-Nexus-exe
          path: |
            dist-electron/*.exe
            dist-electron/*.yml
            dist-electron/*.blockmap
          if-no-files-found: warn

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application (React/Vite)
        run: npm run build

      - name: Generate Android App Icons
        run: npm run android:icons

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Remove local.properties to auto-detect GitHub Actions Android SDK
        run: rm -f android/local.properties

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon
          cd ..
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/Overdesk-Nexus.apk

      - name: Upload Android APK Artifact to GitHub Action Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Overdesk-Nexus-apk
          path: apk/Overdesk-Nexus.apk
          if-no-files-found: warn

  release:
    name: Publish Release
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Overdesk-Nexus-exe
          path: release-assets/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Overdesk-Nexus-apk
          path: release-assets/android

      - name: Get App Version
        run: node -e "const fs = require('fs'); fs.appendFileSync(process.env.GITHUB_ENV, 'VERSION=' + require('./package.json').version + '\n')"

      - name: Publish Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Overdesk Nexus v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            release-assets/windows/*.exe
            release-assets/windows/*.yml
            release-assets/windows/*.blockmap
            release-assets/android/Overdesk-Nexus.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

