name: Build & Release Overdesk Nexus

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies
        run: npm install

      - name: Build Web Application (React/Vite)
        run: npm run build

      - name: Build Executable (Electron Builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install electron-builder --win --publish never

      - name: Get App Version
        run: node -e "const fs = require('fs'); fs.appendFileSync(process.env.GITHUB_ENV, 'VERSION=' + require('./package.json').version + '\n')"

      - name: Upload Installer Artifact to GitHub Action Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Overdesk-Nexus-exe
          path: |
            dist-electron/*.exe
            dist-electron/*.yml
            dist-electron/*.blockmap
          if-no-files-found: warn

      - name: Publish Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Overdesk Nexus v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist-electron/*.exe
            dist-electron/*.yml
            dist-electron/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
